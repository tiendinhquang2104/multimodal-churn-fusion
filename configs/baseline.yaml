dataset:
  name: hm

drive:
  shared_project_folder_id: 1YHWbumTiVjEZ1evW-TV_ZctoUh3CABR8
  shortcut_name: Project Master Thesis

model:
  common_embedding_dim: 128

transaction_encoder:
  type: transformer
  input_dim: 3
  model_dim: 128
  num_heads: 4
  num_layers: 2
  max_sequence_length: 32
  output_dim: 128

text_encoder:
  type: minilm
  model_name: sentence-transformers/all-MiniLM-L6-v2
  output_dim: 128
  freeze: true

image_encoder:
  type: clip
  model_name: openai/clip-vit-base-patch32
  output_dim: 128
  freeze: true

fusion:
  type: concat

classifier:
  hidden_dims: [256, 64]
  dropout: 0.2

features:
  max_customers: 16
  transaction_batch_size: 16
  text_batch_size: 32
  image_batch_size: 8

training:
  batch_size: 256
  epochs: 20
  learning_rate: 0.001
  seed: 42

evaluation:
  metrics: [roc_auc, pr_auc, f1, precision, recall]

# Used only by --mode temporal_ssl. The legacy baseline above is unchanged.
temporal_ssl:
  max_history: 32
  batch_size: 256
  export_batch_size: 1024
  learning_rate: 0.0001
  temperature: 0.1
  max_epochs: 10
  validation_percent: 5
  long_history_drop_rate: 0.2
  short_history_mask_rate: 0.1
  minilm_revision: main
  clip_revision: main
